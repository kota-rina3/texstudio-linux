name: texstudio-loong64

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译构建 (loong64)
    runs-on: ubuntu-latest

    steps:
    - name: 检查代码
      uses: actions/checkout@v4

    - name: 设置 QEMU（loong64 模拟）
      uses: docker/setup-qemu-action@v4

    - name: 在 deepin-loong64 容器中编译
      run: |
        docker run --platform linux/loong64 \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          linuxdeepin/deepin:crimson-loong64-v1.6.0 \
          bash -c '
            set -e
            apt update && apt upgrade -y
            apt install -y \
              build-essential cmake git python3-pip make \
              qtbase5-dev libqt5svg5-dev qtdeclarative5-dev qttools5-dev libqt5svg5-dev libpoppler-qt5-dev libpoppler-cpp-dev pkg-config zlib1g-dev libquazip5-dev
            mkdir build && cd build
            cmake -DCMAKE_INSTALL_PREFIX=./build/appdir/usr .. -Wno-dev
            cmake --build . --target install -- -j 8
          '

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: texstudio-loong64
        path: ./build